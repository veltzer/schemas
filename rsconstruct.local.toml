# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# Runtime deps so CI installs what the code imports (pylint resolves them).
[dependencies]
pip = [
    "pyclassifiers",
    "check-jsonschema",
]

# The Makefile validated each docs/json/*.json two ways: check-jsonschema
# against the metaschema named in the file's "$schema", and validate_schema.py
# (propertyOrdering must match properties). The generator drives
# scripts/check_json_schema.py, which runs both per file and writes a stamp on
# success. (json.tool well-formedness is covered by ijsonlint; yaml by
# iyamllint.)
[processor.generator.jsonschema]
command = "scripts/check_json_schema.py"
src_dirs = ["docs/json"]
src_extensions = [".json"]
output_dir = "out/check"
output_extension = "stamp"
batch = false

# The schema files and the site live under docs/ here, not the fleet-default
# dirs, so point the JSON/YAML linters at them (the Makefile ran json.tool and
# validate_yaml over docs/). ijsonlint re-checks well-formedness that the
# schema generator also implies; iyamllint covers docs/yaml.
[processor.ijsonlint]
src_dirs = ["docs/json"]

[processor.iyamllint]
src_dirs = ["docs/yaml"]

# The Makefile ran jshint --extract=auto over docs/*.html (embedded JS);
# htmlhint is rsconstruct's HTML linter and covers docs/index.html.
[processor.htmlhint]
src_dirs = ["docs"]
