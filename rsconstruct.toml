# rsconstruct build configuration for this repository.

[build]

[analyzer.python]

[processor.ruff]
src_dirs = ["scripts", "config"]

[processor.pylint]
src_dirs = ["scripts", "config"]

[processor.mypy]
src_dirs = ["scripts", "config"]

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.ijsonlint]
src_dirs = ["docs/json"]
src_files = [".ajv-config.json", "package.json"]

[processor.htmlhint]
src_dirs = ["docs"]

[processor.generator.jsonschema]
command = "scripts/check_json_schema.py"
src_dirs = ["docs/json"]
src_extensions = [".json"]
output_dir = "out/check"
output_extension = "stamp"
batch = false

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_files = ["README.md"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.yamllint]
src_dirs = ["docs/yaml", "support"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.xmllint]
src_dirs = ["docs"]
