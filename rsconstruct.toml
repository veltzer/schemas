# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[build]

[analyzer.python]

[processor.ruff]
src_dirs = ["scripts", "config"]

[processor.pylint]
src_dirs = ["scripts", "config"]

[processor.mypy]
src_dirs = ["scripts", "config"]

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.iyamllint]
src_dirs = ["docs/yaml"]

[processor.ijsonlint]
src_dirs = ["docs/json"]

[processor.htmlhint]
src_dirs = ["docs"]

[processor.generator.jsonschema]
command = "scripts/check_json_schema.py"
src_dirs = ["docs/json"]
src_extensions = [".json"]
output_dir = "out/check"
output_extension = "stamp"
batch = false

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
# actionlint 1.7.12's runner-label list predates the official ubuntu-26.04
# hosted runner; drop this ignore once a newer actionlint knows the label
args = ["-ignore", 'label "ubuntu-26\.04" is unknown']
